<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Women with Baskets</h1>
        <p class="intro">
            This artwork by Anita Magsaysay-Ho portrays Filipino women engaged
            in traditional livelihood activities. Known for her modernist style,
            Magsaysay-Ho highlighted the strenght, grace, and dignity of rural women
            through harmonious composition and earthy tones.
        </p>
    </header>

    <section class="gallery">
        <img src="images/4.jpg" alt="Image 4">
        <img src="images/3.jpg" alt="Image 3">
        <img src="images/1.jpg" alt="Image 1">
        <img src="images/6.jpg" alt="Image 6">
        <img src="images/2.jpg" alt="Image 2">
        <img src="images/5.jpg" alt="Image 5">
    </section>

    <section class="video-section">
        <h2>Featured Video</h2>
        <video controls>
            <source src="Anita.mp4" type="video/mp4">
        </video>
    </section>

</body>
</html>
